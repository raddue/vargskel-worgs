<script>
(()=>{
 /* #19: a palette row names a record and the entry inside it, the way intel.html's #map/<loc>
    names two things. Land the reader on that entry instead of the top of the file. */
 const raw=decodeURIComponent(location.hash.slice(1)).split("/"),id=raw[0],entry=raw[1]||"";
 if(!id){location.replace("pilots.html");return;}
 document.getElementById("dossier").innerHTML=UI.pilotDossier(id);
 if(entry){const hit=document.getElementById(id+"-x")||document.getElementById(entry);if(hit&&hit.scrollIntoView)hit.scrollIntoView({block:"center"});}
 document.title="Vargskel Worgs | "+((window.CAMPAIGN.pilots.find(p=>p.id===id)||{}).name||id);
})();
</script>
