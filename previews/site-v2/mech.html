<script>
(()=>{
 const render=first=>{
 /* #19: a palette row names a record and the entry inside it, the way intel.html's #map/<loc>
    names two things. Land the reader on that entry instead of the top of the file. */
 const raw=decodeURIComponent(location.hash.slice(1)).split("/"),id=raw[0],entry=raw[1]||"";
 if(!id){location.replace("previews/site-v2/mechbay.html");return;}
 document.getElementById("dossier").innerHTML=UI.mechDossier(id);
 UI.wireDossierActions();
 if(entry){const hit=document.getElementById(id+"-x")||document.getElementById(entry);if(hit&&hit.scrollIntoView)hit.scrollIntoView({block:"center"});}else if(!first)scrollTo(0,0);
 document.title="Vargskel Worgs | "+((window.CAMPAIGN.mechs.find(m=>m.id===id)||{}).name||id);
 };
 render(true);
 /* A palette row for another record on this page only changes the hash; draw that record. */
 addEventListener("hashchange",()=>render(false));
})();
</script>
